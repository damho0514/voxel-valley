    <script>
      (function () {
        var ok = function () { document.body.classList.add('portrait-ok'); try { localStorage.setItem('vv-portrait-ok', '1'); } catch (e) {} };
        try { if (localStorage.getItem('vv-portrait-ok')) document.body.classList.add('portrait-ok'); } catch (e) {}
        document.getElementById('portrait-ok').addEventListener('click', ok);
      })();
      // Stale copies: the retired Unity build left a service worker over /voxel-valley/ that serves
      // cached files, and tabs left open for days keep running an old build. Drop any worker and
      // its caches, then keep checking for a newer deploy and offer the reload.
      (function () {
        try {
          if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              if (!regs.length) return;

                .then(function () { return window.caches ? caches.keys() : []; })
                .then(function (keys) { return Promise.all(keys.map(function (k) { return caches.delete(k); })); })
                .then(function () {
                  try { if (sessionStorage.getItem('vv-sw-cleared')) return; sessionStorage.setItem('vv-sw-cleared', '1'); } catch (e) {}
                  location.reload();
                });
            });
          }
        } catch (e) {}
        var bundle = function (html) { var m = /index-[0-9a-f]+\.js/.exec(html); return m && m[0]; };
        var mine = null, shown = false, last = 0;
        var check = function () {
          // The bundle tags come after this script, so read them once parsing is done.
          if (!mine) mine = bundle(document.documentElement.innerHTML);
          if (shown || !mine || !window.fetch || Date.now() - last < 60 * 1000) return;
          last = Date.now();
          fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store' })
            .then(function (r) { return r.ok ? r.text() : ''; })
            .then(function (html) {
              var latest = bundle(html);
              if (!latest || latest === mine || shown) return;
              shown = true;
              var bar = document.createElement('div');
              bar.style.cssText = 'position:fixed;left:50%;top:max(10px,env(safe-area-inset-top));transform:translateX(-50%);z-index:100;'
                + 'display:flex;align-items:center;gap:12px;padding:10px 12px 10px 16px;border-radius:14px;background:rgba(12,18,34,.94);'
                + 'border:1px solid rgba(232,194,106,.7);color:#fff6dc;font:800 14px -apple-system,"Apple SD Gothic Neo",sans-serif;'
                + 'box-shadow:0 6px 24px rgba(0,0,0,.45);white-space:nowrap';
              bar.innerHTML = '<span>새 버전이 나왔어요</span>';
              var b = document.createElement('button');
              b.textContent = '새로고침';
              b.style.cssText = 'padding:8px 14px;border-radius:10px;border:0;background:#f2c35b;color:#2a1b00;font:900 14px -apple-system,"Apple SD Gothic Neo",sans-serif;cursor:pointer';
              b.onclick = function () { location.reload(); };
              bar.appendChild(b);
              document.body.appendChild(bar);
            })
            .catch(function () {});
        };
        setInterval(check, 5 * 60 * 1000);
        document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') check(); });
        window.addEventListener('focus', check);
      })();
