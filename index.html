<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Voxel Valley</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Voxel Valley">
  <meta name="theme-color" content="#2b4552">
  <meta name="build" content="20261105152756">
  <style>
    html, body { margin: 0; height: 100%; background: #2b4552; overflow: hidden; overscroll-behavior: none;
      touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; color: #fff; }
    #game { position: fixed; inset: 0; width: 100vw; height: 100dvh; display: block; outline: none; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; background: #2b4552; transition: opacity .4s; }
    #loading img { width: 96px; height: 96px; border-radius: 22px; }
    #loading .name { font-size: 22px; font-weight: 700; }
    #bar { width: 220px; height: 8px; border-radius: 4px; background: rgba(255,255,255,.15); overflow: hidden; }
    #fill { width: 0; height: 100%; background: #6fd08c; transition: width .2s; }
    #msg { font-size: 15px; opacity: .9; text-align: center; padding: 0 24px; }
    #retry { display: none; padding: 10px 22px; border: 0; border-radius: 10px; background: #6fd08c; color: #13232b; font-size: 15px; }
    #inapp { position: fixed; inset: 0; z-index: 20; display: none; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; padding: 24px; text-align: center; background: #2b4552; font-size: 16px; line-height: 1.6; }
    #inapp a { display: inline-block; padding: 12px 22px; border-radius: 12px; background: #6fd08c; color: #13232b;
      font-weight: 700; text-decoration: none; }
    #inapp .url { font-size: 13px; opacity: .8; word-break: break-all; -webkit-user-select: text; user-select: text; }
    #install { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%);
      width: min(360px, calc(100vw - 32px)); box-sizing: border-box; padding: 16px 18px; border-radius: 16px;
      background: #f7f9fa; color: #13232b; box-shadow: 0 10px 30px rgba(0,0,0,.35); z-index: 10; font-size: 15px; line-height: 1.5; }
    #install[hidden] { display: none; }
    #install b { color: #0b5cad; }
    #install .row { display: flex; align-items: center; gap: 12px; }
    #install img { width: 52px; height: 52px; border-radius: 12px; flex: none; }
    #install ol { margin: 10px 0 0; padding-left: 20px; }
    #install button { margin-top: 12px; width: 100%; padding: 10px; border: 0; border-radius: 10px; background: #dfe7eb;
      font-size: 15px; color: #13232b; }
    #install::after { content: ""; position: absolute; left: 50%; bottom: -9px; margin-left: -9px;
      border: 9px solid transparent; border-bottom: 0; border-top-color: #f7f9fa; }
    /* Landscape: Safari's share button isn't at the bottom, and space is tight. */
    @media (orientation: landscape) {
      #install { bottom: 10px; padding: 12px 16px; font-size: 13px; width: min(420px, calc(100vw - 32px)); }
      #install img { width: 40px; height: 40px; }
      #install ol { margin-top: 6px; }
      #install button { margin-top: 8px; padding: 8px; }
      #install::after { display: none; }
    }
  </style>
</head>
<body>
  <canvas id="game" tabindex="-1"></canvas>
  <div id="loading">
    <img src="icons/icon-192.png" alt="">
    <div class="name">Voxel Valley</div>
    <div id="bar"><div id="fill"></div></div>
    <div id="msg">게임을 받는 중... 0%</div>
    <button id="retry">다시 시도</button>
  </div>
  <div id="inapp">
    <div><b>Safari에서 열어 주세요</b><br>앱 안 브라우저에서는 설치와 게임이 제대로 동작하지 않아요.</div>
    <a id="openSafari" href="#">Safari로 열기</a>
    <div>안 열리면 오른쪽 아래(또는 위) <b>⋯ 메뉴 → Safari로 열기 / 다른 브라우저로 열기</b>를 눌러 주세요.</div>
    <div class="url" id="url"></div>
  </div>
  <div id="install" hidden>
    <div class="row">
      <img src="icons/icon-180.png" alt="">
      <div><b>앱으로 설치하기</b><br>홈 화면에 추가하면 아이콘으로 바로 실행되고, 인터넷 없이도 열려요.</div>
    </div>
    <ol>
      <li>Safari의 <b>공유 버튼</b>(네모에 화살표)을 눌러요</li>
      <li><b>홈 화면에 추가</b>를 누르고 <b>추가</b></li>
    </ol>
    <button id="later">나중에</button>
  </div>
  <script>
    (function () {
      var ua = navigator.userAgent;
      var here = location.href.split('#')[0];

      // In-app browsers (KakaoTalk, Instagram, Facebook, LINE, NAVER, ...) can't
      // add to the home screen and are flaky with WebGL: send people to Safari.
      var inApp = /KAKAOTALK|Instagram|FBAN|FBAV|Line\/|NAVER|DaumApps|everytimeApp|; wv\)/i.test(ua);
      if (/KAKAOTALK/i.test(ua)) {
        location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(here);
      }
      if (inApp) {
        var box = document.getElementById('inapp');
        box.style.display = 'flex';
        document.getElementById('url').textContent = here;
        document.getElementById('openSafari').href = /KAKAOTALK/i.test(ua)
          ? 'kakaotalk://web/openExternal?url=' + encodeURIComponent(here)
          : 'x-safari-' + here;
        document.getElementById('loading').style.display = 'none';
        return; // don't start the game inside the in-app browser
      }
      var iOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var installed = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches ||
        matchMedia('(display-mode: fullscreen)').matches;
      var dismissed = false;
      try { dismissed = localStorage.getItem('vv-install-later') === '1'; } catch (e) {}
      var install = document.getElementById('install');
      var later = document.getElementById('later');
      function closeInstall(e) {
        if (e) { e.preventDefault(); e.stopPropagation(); }
        install.hidden = true;
        try { localStorage.setItem('vv-install-later', '1'); } catch (err) {}
      }
      // Touch/pointer handlers too: the game may swallow synthesized clicks.
      ['click', 'touchend', 'pointerup'].forEach(function (t) { later.addEventListener(t, closeInstall, { passive: false }); });
      function offerInstall() { if (iOS && !installed && !dismissed) install.hidden = false; }

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
      }

      var canvas = document.getElementById('game');
      var fill = document.getElementById('fill');
      var msg = document.getElementById('msg');
      var retry = document.getElementById('retry');
      retry.addEventListener('click', function () { location.reload(); });
      retry.addEventListener('touchend', function () { location.reload(); });
      window.addEventListener('error', function (e) {
        if (document.getElementById('loading')) {
          msg.textContent = '문제가 생겼어요: ' + (e.message || e.error || '알 수 없는 오류');
          retry.style.display = 'inline-block';
        }
      });
      var config = {
        dataUrl: "Build/WebGL.data.unityweb",
        frameworkUrl: "Build/WebGL.framework.js.unityweb",
        codeUrl: "Build/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "damho0514",
        productName: "Voxel Valley",
        productVersion: "0.1.0",
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      };
      var script = document.createElement('script');
      script.src = "Build/WebGL.loader.js";
      script.onerror = function () {
        msg.textContent = '게임 파일을 받지 못했어요. 인터넷 연결을 확인해 주세요.';
        retry.style.display = 'inline-block';
      };
      script.onload = function () {
        createUnityInstance(canvas, config, function (p) {
          var pct = Math.round(p * 100);
          fill.style.width = pct + '%';
          msg.textContent = pct < 90 ? '게임을 받는 중... ' + pct + '%' : '준비 중...';
        })
          .then(function () {
            var l = document.getElementById('loading');
            l.style.opacity = '0';
            setTimeout(function () { l.remove(); offerInstall(); }, 450);
            canvas.focus();
          })
          .catch(function (e) {
            msg.textContent = '실행할 수 없어요: ' + e;
            retry.style.display = 'inline-block';
          });
      };
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
